name: SAFE-ALERT-AI - Mise à jour quotidienne

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installation des dependances
        run: |
          pip install pandas numpy openpyxl joblib scikit-learn pyarrow requests

      - name: Mise à jour des données
        run: python update_daily.py

      - name: Commit et push des nouvelles données
        run: |
          git config --local user.email "safe-alert-ai@bot.cm"
          git config --local user.name "SAFE-ALERT-AI Bot"
          git add data/processed/
          git diff --staged --quiet || git commit -m "Mise à jour quotidienne $(date +'%Y-%m-%d')"
          git push
